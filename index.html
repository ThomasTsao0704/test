<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>繪圖檯 · Plotsheet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/12.4.2/math.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --paper:#F6F7F1;--paper-card:#FCFDFA;--grid:#E5EADD;--grid-bold:#D6DDC9;
    --ink:#1F262A;--ink-soft:#5C6670;--ink-faint:#8A9098;--line:#D2D8C9;
    --accent:#1F6F5C;--accent-deep:#185647;--accent-soft:#E2EFE9;
    --warn:#9A4A33;--warn-soft:#F4E6E0;--radius:4px;
    --mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;
    --display:'Space Grotesk','Noto Sans TC',system-ui,sans-serif;
    --body:'Noto Sans TC',system-ui,-apple-system,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:var(--body);color:var(--ink);background-color:var(--paper);
    background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
    background-size:24px 24px;line-height:1.6;-webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1180px;margin:0 auto;padding:0 20px 80px}

  header.top{padding:34px 0 26px;border-bottom:1.5px solid var(--ink);margin-bottom:30px}
  .brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
  .mark{font-family:var(--display);font-weight:700;font-size:30px;letter-spacing:-0.5px;display:inline-flex;align-items:center;gap:10px}
  .mark .pen{width:26px;height:26px;border:2px solid var(--accent);border-radius:50%;position:relative;flex:none}
  .mark .pen::after{content:"";position:absolute;inset:6px;background:var(--accent);border-radius:50%}
  .mark .sub{font-family:var(--mono);font-weight:500;font-size:13px;color:var(--ink-faint);letter-spacing:1px;text-transform:uppercase}
  .tagline{margin-top:10px;color:var(--ink-soft);font-size:14.5px;max-width:560px}
  .privacy-badge{display:inline-flex;align-items:center;gap:7px;margin-top:14px;font-family:var(--mono);font-size:11.5px;letter-spacing:.3px;color:var(--accent-deep);background:var(--accent-soft);border:1px solid var(--accent);padding:5px 11px;border-radius:100px}
  .privacy-badge .dot{width:7px;height:7px;background:var(--accent);border-radius:50%}

  .panel{background:var(--paper-card);border:1.5px solid var(--ink);border-radius:var(--radius);margin-bottom:22px}
  .panel-head{display:flex;align-items:center;gap:11px;padding:13px 18px;border-bottom:1px solid var(--line)}
  .panel-num{font-family:var(--mono);font-weight:600;font-size:12px;color:var(--paper-card);background:var(--ink);width:24px;height:24px;border-radius:3px;display:grid;place-items:center;flex:none}
  .panel-title{font-family:var(--display);font-weight:600;font-size:16px}
  .panel-title .en{font-family:var(--mono);font-weight:400;font-size:11.5px;color:var(--ink-faint);margin-left:8px;letter-spacing:.5px}
  .panel-body{padding:18px}

  .drop{border:2px dashed var(--line);border-radius:var(--radius);background-color:var(--paper);
    background-image:linear-gradient(var(--grid-bold) 1px,transparent 1px),linear-gradient(90deg,var(--grid-bold) 1px,transparent 1px);
    background-size:18px 18px;padding:46px 24px;text-align:center;cursor:pointer;transition:border-color .18s,background-color .18s}
  .drop:hover,.drop.drag{border-color:var(--accent);background-color:var(--accent-soft)}
  .drop .icon{width:46px;height:56px;margin:0 auto 16px;border:2px solid var(--accent);border-radius:3px;position:relative;background:var(--paper-card)}
  .drop .icon::before{content:"";position:absolute;top:9px;left:9px;right:9px;height:2px;background:var(--accent);box-shadow:0 7px var(--accent),0 14px var(--accent)}
  .drop h3{font-family:var(--display);font-weight:600;font-size:17px;margin-bottom:6px}
  .drop p{color:var(--ink-soft);font-size:13.5px}
  .drop .browse{color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:2px}

  .field-row{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end}
  .field{display:flex;flex-direction:column;gap:6px;min-width:140px}
  .field label{font-family:var(--mono);font-size:11px;letter-spacing:.6px;text-transform:uppercase;color:var(--ink-soft)}
  select,input[type=number]{font-family:var(--body);font-size:14px;color:var(--ink);background:var(--paper-card);border:1.5px solid var(--line);border-radius:3px;padding:8px 10px;min-width:130px}
  select:focus,input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

  .encoding-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px;font-size:13px}
  .encoding-bar .lbl{font-family:var(--mono);font-size:11px;letter-spacing:.5px;color:var(--ink-soft);text-transform:uppercase}

  .types{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:16px}
  .type-btn{font-family:var(--body);font-size:13px;font-weight:500;color:var(--ink-soft);background:var(--paper-card);border:1.5px solid var(--line);border-radius:3px;padding:7px 12px;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:6px}
  .type-btn:hover{border-color:var(--accent);color:var(--ink)}
  .type-btn.on{background:var(--ink);color:var(--paper-card);border-color:var(--ink)}
  .type-btn .rec{font-family:var(--mono);font-size:9px;background:var(--accent);color:#fff;padding:1px 5px;border-radius:100px}

  .ychips{display:flex;flex-wrap:wrap;gap:7px}
  .ychip{font-size:13px;border:1.5px solid var(--line);border-radius:3px;padding:6px 10px;cursor:pointer;background:var(--paper-card);transition:all .15s;user-select:none;display:inline-flex;align-items:center;gap:6px}
  .ychip:hover{border-color:var(--accent)}
  .ychip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-deep);font-weight:500}
  .ychip .sw{width:11px;height:11px;border-radius:2px;border:1.5px solid var(--ink-faint)}
  .ychip.on .sw{background:var(--accent);border-color:var(--accent)}

  .table-scroll{overflow:auto;border:1px solid var(--line);border-radius:3px;max-height:340px}
  table{border-collapse:collapse;width:100%;font-size:13px}
  th,td{padding:7px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
  thead th{position:sticky;top:0;background:var(--paper-card);border-bottom:1.5px solid var(--ink);z-index:1}
  .col-name{font-family:var(--display);font-weight:600;font-size:13px}
  .col-type{display:inline-block;font-family:var(--mono);font-size:9.5px;letter-spacing:.4px;text-transform:uppercase;padding:1px 6px;border-radius:100px;margin-left:8px;vertical-align:middle}
  .t-number{background:var(--accent-soft);color:var(--accent-deep)}
  .t-date{background:#E6E9F2;color:#3A4A78}.t-text{background:#EFEDE6;color:#6B5F44}
  td.num{font-family:var(--mono);text-align:right}
  tbody tr:nth-child(even){background:rgba(0,0,0,.018)}
  .meta-line{font-family:var(--mono);font-size:12px;color:var(--ink-soft);margin-bottom:12px}
  .meta-line b{color:var(--accent-deep)}

  /* ----- dual views ----- */
  .views{display:flex;flex-direction:column;gap:20px}
  .views.dual{flex-direction:row}
  .view{flex:1 1 0;min-width:0;border:1px solid var(--line);border-radius:var(--radius);background:rgba(255,255,255,.4)}
  .view-head{display:flex;align-items:center;gap:9px;padding:10px 14px;border-bottom:1px dashed var(--line)}
  .view-tag{font-family:var(--mono);font-weight:600;font-size:11px;letter-spacing:.8px;color:var(--paper-card);background:var(--accent);padding:3px 9px;border-radius:100px}
  .view-tag.b{background:#3A6EA5}
  .view-body{padding:14px}

  .chart-card{background-color:var(--paper-card);
    background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
    background-size:22px 22px;border:1px solid var(--line);border-radius:3px;padding:14px;position:relative;height:360px}

  .cond-row{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}
  .cond-row:empty{display:none}
  .colors{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0 4px;padding-top:12px;border-top:1px dashed var(--line)}
  .color-item{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-soft)}
  .color-item input[type=color]{-webkit-appearance:none;appearance:none;width:24px;height:24px;border:1.5px solid var(--line);border-radius:4px;padding:0;background:none;cursor:pointer;min-width:24px}
  .color-item input[type=color]::-webkit-color-swatch-wrapper{padding:2px}
  .color-item input[type=color]::-webkit-color-swatch{border:none;border-radius:2px}
  .colors .clbl{font-family:var(--mono);font-size:10px;letter-spacing:.5px;text-transform:uppercase;color:var(--ink-faint);width:100%;margin-bottom:-4px}

  .dual-toggle{margin-left:auto;font-family:var(--body);font-size:13px;font-weight:500;cursor:pointer;border:1.5px solid var(--ink);border-radius:3px;padding:6px 13px;background:transparent;color:var(--ink);transition:all .15s}
  .dual-toggle:hover{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-deep)}
  .dual-toggle.on{background:var(--ink);color:var(--paper-card)}

  .btn{font-family:var(--body);font-size:13px;font-weight:500;cursor:pointer;border:1.5px solid var(--ink);border-radius:3px;padding:7px 14px;background:var(--ink);color:var(--paper-card);transition:all .15s}
  .btn:hover{background:var(--accent);border-color:var(--accent)}
  .btn.ghost{background:transparent;color:var(--ink)}
  .btn.ghost:hover{background:var(--accent-soft);color:var(--accent-deep);border-color:var(--accent)}
  .view-actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-top:10px}

  .note{font-family:var(--mono);font-size:11px;color:var(--ink-faint);margin-top:8px;line-height:1.5}
  .hidden{display:none!important}
  .msg{padding:10px 13px;border-radius:3px;font-size:13px;margin-top:12px}
  .msg.err{background:var(--warn-soft);color:var(--warn);border:1px solid var(--warn)}
  footer{margin-top:40px;padding-top:20px;border-top:1px solid var(--line);font-family:var(--mono);font-size:11.5px;color:var(--ink-faint);text-align:center;letter-spacing:.3px}

  @media (max-width:820px){.views.dual{flex-direction:column}}
  @media (max-width:560px){.mark{font-size:24px}.panel-body{padding:14px}.chart-card{height:320px}}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><span class="mark"><span class="pen"></span>繪圖檯</span><span class="sub">Plotsheet</span></div>
    <p class="tagline">把一份 CSV 攤在繪圖紙上,挑欄位、配顏色、開兩個視圖並排比較。從上傳到圖表,全程在你的瀏覽器裡完成。</p>
    <span class="privacy-badge"><span class="dot"></span>資料不會離開這個裝置 · 不上傳任何伺服器</span>
  </header>

  <section class="panel">
    <div class="panel-head"><span class="panel-num">1</span><span class="panel-title">放上你的檔案<span class="en">UPLOAD</span></span></div>
    <div class="panel-body">
      <div class="encoding-bar">
        <span class="lbl">編碼</span>
        <select id="encoding" title="中文檔常見 Big5（繁中）或 GBK（簡中）">
          <option value="utf-8">UTF-8（預設）</option>
          <option value="big5">Big5（繁體中文）</option>
          <option value="gbk">GBK / GB18030（簡體中文）</option>
        </select>
        <span style="color:var(--ink-faint);font-size:12px">讀到亂碼時,換個編碼再上傳一次</span>
      </div>
      <div class="drop" id="drop">
        <input type="file" id="file" accept=".csv,text/csv" class="hidden">
        <div class="icon"></div>
        <h3>把 CSV 拖進來</h3>
        <p>或 <span class="browse">點這裡選檔案</span> · 只接受 .csv</p>
      </div>
      <div id="uploadMsg"></div>
    </div>
  </section>

  <section class="panel hidden" id="previewPanel">
    <div class="panel-head"><span class="panel-num">2</span><span class="panel-title">先核對資料<span class="en">PREVIEW</span></span></div>
    <div class="panel-body">
      <div class="meta-line" id="metaLine"></div>
      <div class="table-scroll"><table id="previewTable"></table></div>
      <p class="note">只顯示前 50 列供核對。型別由系統自動判斷,若判錯通常是欄位夾雜了文字或空白。</p>
    </div>
  </section>

  <section class="panel hidden" id="chartPanel">
    <div class="panel-head">
      <span class="panel-num">3</span><span class="panel-title">繪製與比較<span class="en">PLOT</span></span>
      <button class="dual-toggle" id="dualToggle">＋ 啟用雙視圖比較</button>
    </div>
    <div class="panel-body">
      <div class="views" id="views">
        <div class="view" data-view="A"></div>
        <div class="view hidden" data-view="B"></div>
      </div>
    </div>
  </section>

  <footer>PLOTSHEET · 純前端 CSV 視覺化 · PapaParse + Chart.js</footer>
</div>

<script>
const PALETTE=['#1F6F5C','#C8553D','#3A6EA5','#B58B2E','#7B4B94','#4F9D69','#A23B72','#2C8C99','#6B7A8F','#D38B3E'];
const SCATTER_CAP=5000;
const POINTS={'• 小圓點':{s:'circle',r:2},'● 大圓點':{s:'circle',r:5},'— 短線':{s:'dash',r:5},'＋ 十字':{s:'cross',r:6},'■ 方塊':{s:'rect',r:4}};
const $=id=>document.getElementById(id);
const state={file:null,columns:[],rows:[],dual:false,views:{
  A:{type:'bar',chart:null,colors:{},built:false},
  B:{type:'bar',chart:null,colors:{},built:false}
}};

/* ---------- upload ---------- */
const drop=$('drop'),fileInput=$('file');
drop.addEventListener('click',()=>fileInput.click());
drop.addEventListener('dragover',e=>{e.preventDefault();drop.classList.add('drag')});
drop.addEventListener('dragleave',()=>drop.classList.remove('drag'));
drop.addEventListener('drop',e=>{e.preventDefault();drop.classList.remove('drag');if(e.dataTransfer.files.length)handleFile(e.dataTransfer.files[0])});
fileInput.addEventListener('change',e=>{if(e.target.files.length)handleFile(e.target.files[0])});
$('encoding').addEventListener('change',()=>{if(state.file)handleFile(state.file)});

function showErr(w,t){$(w).innerHTML=`<div class="msg err">${t}</div>`}
function clearMsg(w){$(w).innerHTML=''}

function handleFile(file){
  clearMsg('uploadMsg');
  if(!/\.csv$/i.test(file.name)&&file.type!=='text/csv'){showErr('uploadMsg','這看起來不是 CSV 檔。請選擇副檔名為 .csv 的檔案。');return}
  state.file=file;
  const reader=new FileReader();
  reader.onload=e=>{
    let text;
    try{text=new TextDecoder($('encoding').value,{fatal:false}).decode(new Uint8Array(e.target.result));}
    catch(err){showErr('uploadMsg','無法以選定的編碼讀取檔案,換個編碼再試一次。');return}
    parseCSV(text,file.name);
  };
  reader.onerror=()=>showErr('uploadMsg','讀取檔案時發生問題,請再試一次。');
  reader.readAsArrayBuffer(file);
}

function parseCSV(text,name){
  const res=Papa.parse(text,{header:true,skipEmptyLines:'greedy',transformHeader:h=>h.trim()});
  const fields=(res.meta.fields||[]).filter(f=>f!=='');
  const rows=res.data.filter(r=>fields.some(f=>r[f]!==undefined&&r[f]!==''));
  if(!fields.length||!rows.length){showErr('uploadMsg','檔案裡沒有讀到可用的資料列,確認第一行是欄位名稱、且檔案不是空的。');return}
  state.columns=fields.map(f=>({name:f,type:detectType(rows.map(r=>r[f]))}));
  state.rows=rows;
  state._dataVersion=(state._dataVersion||0)+1;
  // reset views
  state.views.A={type:recommend(),chart:null,colors:{},built:false};
  state.views.B={type:recommend(),chart:null,colors:{},built:false};
  renderPreview(name);
  $('previewPanel').classList.remove('hidden');
  $('chartPanel').classList.remove('hidden');
  buildView('A');
  if(state.dual)buildView('B');
}

/* ---------- type detect ---------- */
function toNum(v){if(v==null)return NaN;const s=String(v).trim().replace(/[,\s]/g,'').replace(/[%$￥¥€£]/g,'');if(s==='')return NaN;return Number(s)}
function looksLikeDate(v){const s=String(v).trim();if(s.length<4)return false;if(!/[-/.年]/.test(s)&&!/^\d{4}$/.test(s))return false;return !isNaN(Date.parse(s.replace(/年|月/g,'/').replace(/日/g,'')))}
function detectType(values){const s=values.filter(v=>v!==''&&v!=null).slice(0,300);if(!s.length)return'text';let n=0,d=0;for(const v of s){if(!isNaN(toNum(v)))n++;else if(looksLikeDate(v))d++}if(n/s.length>=.8)return'number';if(d/s.length>=.8)return'date';return'text'}
const typeLabel={number:'數值',date:'日期',text:'文字'};

/* ---------- preview ---------- */
function renderPreview(name){
  const {columns,rows}=state;
  $('metaLine').innerHTML=`檔案 <b>${escapeHtml(name)}</b> · <b>${rows.length.toLocaleString()}</b> 列 · <b>${columns.length}</b> 欄`;
  const head='<thead><tr>'+columns.map(c=>`<th><span class="col-name">${escapeHtml(c.name)}</span><span class="col-type t-${c.type}">${typeLabel[c.type]}</span></th>`).join('')+'</tr></thead>';
  const body='<tbody>'+rows.slice(0,50).map(r=>'<tr>'+columns.map(c=>{const v=r[c.name]??'';return`<td${c.type==='number'?' class="num"':''}>${escapeHtml(String(v))}</td>`}).join('')+'</tr>').join('')+'</tbody>';
  $('previewTable').innerHTML=head+body;
}
function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}

/* ---------- columns helpers ---------- */
const CHART_TYPES=[{id:'bar',label:'長條圖'},{id:'line',label:'折線圖'},{id:'points',label:'資料圓點圖'},{id:'pie',label:'圓餅圖'},{id:'scatter',label:'散佈圖'},{id:'histogram',label:'直方圖'}];
const numCols=()=>state.columns.filter(c=>c.type==='number');
const catCols=()=>state.columns.filter(c=>c.type!=='number');
function recommend(){const n=numCols(),c=catCols(),d=state.columns.find(x=>x.type==='date');if(d&&n.length)return'line';if(c.length&&n.length)return'bar';if(n.length>=2)return'scatter';if(n.length===1)return'histogram';return'bar'}

/* ---------- dual toggle ---------- */
$('dualToggle').addEventListener('click',()=>{
  state.dual=!state.dual;
  const btn=$('dualToggle'),views=$('views'),vb=document.querySelector('.view[data-view="B"]');
  if(state.dual){
    btn.classList.add('on');btn.textContent='✕ 關閉雙視圖';
    views.classList.add('dual');vb.classList.remove('hidden');
    if(!state.views.B.built)buildView('B');else{state.views.A.chart&&state.views.A.chart.resize();}
  }else{
    btn.classList.remove('on');btn.textContent='＋ 啟用雙視圖比較';
    views.classList.remove('dual');vb.classList.add('hidden');
  }
  setTimeout(()=>{['A','B'].forEach(v=>state.views[v].chart&&state.views[v].chart.resize())},50);
});

/* ---------- build a view ---------- */
const gid=(name,v)=>$(`${name}_${v}`);
function buildView(v){
  const cont=document.querySelector(`.view[data-view="${v}"]`);
  cont.innerHTML=`
    <div class="view-head"><span class="view-tag${v==='B'?' b':''}">視圖 ${v}</span><span style="font-size:12px;color:var(--ink-soft)">獨立設定,可與另一視圖並排比較</span></div>
    <div class="view-body">
      <div class="types" id="types_${v}"></div>
      <div class="field-row" id="controls_${v}"></div>
      <div class="field-row cond-row" id="filter_${v}"></div>
      <div class="field-row cond-row" id="cond_${v}"></div>
      <div class="colors" id="colors_${v}"></div>
      <div id="msg_${v}"></div>
      <div class="chart-card"><canvas id="canvas_${v}"></canvas></div>
      <div class="view-actions">
        <button class="btn ghost" id="dl_${v}">PNG</button>
        <button class="btn ghost" id="xlsx_${v}">匯出 Excel</button>
        <button class="btn ghost" id="setExp_${v}">匯出設定</button>
        <button class="btn ghost" id="setImp_${v}">匯入設定</button>

function applyFilter(v,rows){
  const onEl=gid('fOn',v),note=gid('fmsg',v);
  if(!onEl||onEl.value!=='on'){if(note)note.textContent='';return rows}
  const col=gid('fCol',v).value,op=gid('fOp',v).value,tgt=gid('fTgt',v).value;
  const sig=JSON.stringify([state._dataVersion,col,op,tgt,gid('fVal',v).value,gid('fVal2',v).value,gid('fCol2',v).value,gid('fN',v).value,gid('fGrp',v)&&gid('fGrp',v).value]);
  const cache=state.views[v]._fcache;
  if(cache&&cache.sig===sig){if(note)note.innerHTML=cache.note;return cache.out}
  let out;
  if(op==='max'||op==='min'){
    const n=Math.max(1,parseInt(gid('fN',v).value)||1);
    const grp=gid('fGrp',v)?gid('fGrp',v).value:'';
    const pick=arr=>{const w=arr.map(r=>({r,n:toNum(r[col])})).filter(o=>!isNaN(o.n));w.sort((a,b)=>op==='max'?b.n-a.n:a.n-b.n);return w.slice(0,n).map(o=>o.r)};
    if(grp){
      const groups=new Map();
      for(const r of rows){const k=String(r[grp]??'');if(!groups.has(k))groups.set(k,[]);groups.get(k).push(r)}
      out=[];for(const arr of groups.values())out.push(...pick(arr));
    }else out=pick(rows);
  }else{
    const rawVal=(gid('fVal',v).value||'').trim(),val=Number(rawVal),val2=Number(gid('fVal2',v).value),col2=gid('fCol2',v).value;
    out=rows.filter(r=>{
      const L=toNum(r[col]),R=tgt==='col'?toNum(r[col2]):val;
      if(op==='between'){if(tgt==='col')return true;return !isNaN(L)&&!isNaN(val)&&!isNaN(val2)&&L>=Math.min(val,val2)&&L<=Math.max(val,val2)}
      if(op==='=='||op==='!='){let eq;
        if(tgt==='col'){const a=toNum(r[col]),b=toNum(r[col2]);eq=(!isNaN(a)&&!isNaN(b))?a===b:String(r[col])===String(r[col2])}
        else{const a=toNum(r[col]);eq=(!isNaN(a)&&!isNaN(val)&&rawVal!=='')?a===val:String(r[col])===rawVal}
        return op==='=='?eq:!eq}
      if(isNaN(L)||isNaN(R))return false;
      switch(op){case'>':return L>R;case'>=':return L>=R;case'<':return L<R;case'<=':return L<=R}
      return true;
    });
  }
  let noteHtml='';
  if(note){
    const sym={'>':'>','>=':'≥','<':'<','<=':'≤','==':'=','!=':'≠','between':'介於'}[op];
    const desc=(op==='max'||op==='min')?`${gid('fGrp',v)&&gid('fGrp',v).value?'依「'+gid('fGrp',v).value+'」分組,每組取':'取'}「${col}」${op==='max'?'最大':'最小'} ${Math.max(1,parseInt(gid('fN',v).value)||1)} 筆`:`「${col}」 ${sym} ${tgt==='col'?'「'+gid('fCol2',v).value+'」':(gid('fVal',v).value||'?')}`;
    noteHtml=`篩選:${escapeHtml(desc)} → 顯示 <b>${out.length.toLocaleString()}</b> / ${rows.length.toLocaleString()} 列`;
    note.innerHTML=noteHtml;
  }
  state.views[v]._fcache={sig,out,note:noteHtml};
  return out;
}

/* ---------- agg / pivot ---------- */
function groupLabels(rows,col){const seen=new Set(),l=[];for(const r of rows){const k=String(r[col]??'');if(!seen.has(k)){seen.add(k);l.push(k)}}return l}
function aggSeries(rows,xCol,yCol,method,labels){
  const acc=new Map(labels.map(l=>[l,{sum:0,count:0,valid:0}]));
  for(const r of rows){const k=String(r[xCol]??''),m=acc.get(k);if(!m)continue;m.count++;const y=toNum(r[yCol]);if(!isNaN(y)){m.sum+=y;m.valid++}}
  return labels.map(l=>{const m=acc.get(l);return method==='平均'?(m.valid?m.sum/m.valid:0):method==='計數'?m.count:m.sum});
}
function pivot(rows,xCol,gCol,yCol,method,labels,groups){
  const m=new Map();
  for(const r of rows){const x=String(r[xCol]??''),g=String(r[gCol]??''),k=x+'\u0000'+g;if(!m.has(k))m.set(k,{sum:0,count:0,valid:0});const o=m.get(k);o.count++;const y=toNum(r[yCol]);if(!isNaN(y)){o.sum+=y;o.valid++}}
  return groups.map(g=>labels.map(l=>{const o=m.get(l+'\u0000'+g);if(!o)return 0;return method==='平均'?(o.valid?o.sum/o.valid:0):method==='計數'?o.count:o.sum}));
}
function sortLabels(labels,col){const t=state.columns.find(c=>c.name===col)?.type;if(t==='number')return labels.slice().sort((a,b)=>toNum(a)-toNum(b));if(t==='date')return labels.slice().sort((a,b)=>Date.parse(String(a).replace(/年|月/g,'/').replace(/日/g,''))-Date.parse(String(b).replace(/年|月/g,'/').replace(/日/g,'')));return labels}
function histogram(rows,col,bins){const vals=rows.map(r=>toNum(r[col])).filter(v=>!isNaN(v));if(!vals.length)return{labels:[],counts:[]};let min=Infinity,max=-Infinity;for(const x of vals){if(x<min)min=x;if(x>max)max=x}if(min===max)return{labels:[String(min)],counts:[vals.length]};const w=(max-min)/bins,counts=new Array(bins).fill(0);for(const x of vals){let i=Math.floor((x-min)/w);if(i>=bins)i=bins-1;if(i<0)i=0;counts[i]++}return{labels:counts.map((_,i)=>`${fmt(min+i*w)}–${fmt(min+(i+1)*w)}`),counts}}
function sampleArr(a,n){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a.slice(0,n)}
function fmt(n){if(!isFinite(n))return'';return Math.abs(n)>=1000?Math.round(n).toLocaleString():Math.round(n*100)/100}
function hexA(hex,a){const n=parseInt(hex.slice(1),16);return`rgba(${n>>16&255},${n>>8&255},${n&255},${a})`}
function colorFor(v,label,i){const map=state.views[v].colors;if(!map[label])map[label]=PALETTE[i%PALETTE.length];return map[label]}
const colType=n=>state.columns.find(c=>c.name===n)?.type;
function bucketDate(val,mode){
  const d=new Date(String(val).replace(/年|月/g,'/').replace(/日/g,''));
  if(isNaN(d))return String(val??'');
  const y=d.getFullYear(),m=d.getMonth()+1;
  if(mode==='按年')return''+y;
  if(mode==='按季')return y+'-Q'+(Math.floor((m-1)/3)+1);
  if(mode==='按月')return y+'-'+String(m).padStart(2,'0');
  if(mode==='按日')return y+'-'+String(m).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  return String(val??'');
}
// Largest-Triangle-Three-Buckets：保留趨勢的降採樣（資料需先依 x 排序）
function lttb(data,threshold){
  const n=data.length;if(threshold>=n||threshold<3)return data.slice();
  const out=[data[0]];const every=(n-2)/(threshold-2);let a=0;
  for(let i=0;i<threshold-2;i++){
    let rs=Math.floor((i+1)*every)+1,re=Math.min(Math.floor((i+2)*every)+1,n);
    let avgX=0,avgY=0;const len=re-rs||1;
    for(let j=rs;j<re;j++){avgX+=data[j].x;avgY+=data[j].y}avgX/=len;avgY/=len;
    let ro=Math.floor(i*every)+1,rt=Math.floor((i+1)*every)+1;
    const pa=data[a];let maxA=-1,next=ro;
    for(let j=ro;j<rt;j++){
      const area=Math.abs((pa.x-avgX)*(data[j].y-pa.y)-(pa.x-data[j].x)*(avgY-pa.y));
      if(area>maxA){maxA=area;next=j}
    }
    out.push(data[next]);a=next;
  }
  out.push(data[n-1]);return out;
}
function linreg(pts){
  const n=pts.length;if(n<2)return null;
  let sx=0,sy=0,sxy=0,sxx=0,syy=0,minx=Infinity,maxx=-Infinity;
  for(const p of pts){sx+=p.x;sy+=p.y;sxy+=p.x*p.y;sxx+=p.x*p.x;syy+=p.y*p.y;if(p.x<minx)minx=p.x;if(p.x>maxx)maxx=p.x}
  const d=n*sxx-sx*sx;if(d===0)return null;
  const slope=(n*sxy-sx*sy)/d,intercept=(sy-slope*sx)/n;
  const den=Math.sqrt(d*(n*syy-sy*sy)),r=den?(n*sxy-sx*sy)/den:0;
  return{slope,intercept,r2:r*r,minx,maxx};
}
function condIsActive(v){const o=gid('condOn',v);if(!o)return false;const e=(gid('condExpr',v)&&gid('condExpr',v).value||'').trim();return o.value!=='off'||!!e}
function recolorInPlace(v){
  const ch=state.views[v].chart,t=state.views[v].type;

  const map=state.views[v].colors;

  else ch.data.datasets.forEach(ds=>{const c=map[ds.label];if(!c)return;
    if(t==='bar'||t==='histogram'){ds.backgroundColor=hexA(c,t==='histogram'?.8:.85);ds.borderColor=c}
    else if(t==='line'){ds.borderColor=c;ds.backgroundColor=hexA(c,.12);ds.pointBackgroundColor=c;ds.pointBorderColor=c}
    else{ds.borderColor=c;ds.backgroundColor=t==='scatter'?hexA(c,.5):c;ds.pointBackgroundColor=c;ds.pointBorderColor=c}
  });
  ch.update('none');
}

      const xCol=gid('xSel',v).value;
      const yCols=[...gid('yChips',v).querySelectorAll('.ychip.on')].map(c=>c.dataset.y);
      const method=gid('aggSel',v).value,grp=gid('grpSel',v).value;
      const combine=(t==='bar'||t==='line')?gid('combineSel',v).value:'並排';
      const lw=t==='line'?(parseFloat(gid('lwNum',v).value)||1.5):1;
      const ptKey=t==='points'?gid('ptSel',v).value:null;
      const dateAgg=gid('dateAgg',v)?gid('dateAgg',v).value:'原始';
      if(!yCols.length){showErr(`msg_${v}`,'至少選一個 Y 軸數值欄位。');return}
      const useDate=dateAgg!=='原始'&&colType(xCol)==='date';
      const drows=useDate?rows.map(r=>({...r,[xCol]:bucketDate(r[xCol],dateAgg)})):rows;
      const sortL=labs=>useDate?labs.slice().sort():sortLabels(labs,xCol);
      let labels,datasets;
      if(grp&&grp!=='（無）'){
        labels=sortL(groupLabels(drows,xCol));
        const groups=groupLabels(drows,grp);
        const mat=pivot(drows,xCol,grp,yCols[0],method==='不彙總（原始值）'?'加總':method,labels,groups);
        seriesLabels=groups;
        datasets=groups.map((g,i)=>mkDS(t,g,mat[i],colorFor(v,g,i),lw,combine==='堆疊',ptKey));
        $(`msg_${v}`).innerHTML=`<p class="note">已依「${escapeHtml(grp)}」分成 ${groups.length} 個系列,數值取第一個 Y 欄位「${escapeHtml(yCols[0])}」。</p>`;
      }else if(method==='不彙總（原始值）'&&!useDate){
        labels=drows.map(r=>String(r[xCol]??''));seriesLabels=yCols;
        datasets=yCols.map((y,i)=>mkDS(t,y,drows.map(r=>toNum(r[y])),colorFor(v,y,i),lw,combine==='堆疊',ptKey));
      }else{
        labels=sortL(groupLabels(drows,xCol));seriesLabels=yCols;
        const m2=method==='不彙總（原始值）'?'加總':method;
        datasets=yCols.map((y,i)=>mkDS(t,y,aggSeries(drows,xCol,y,m2,labels),colorFor(v,y,i),lw,combine==='堆疊',ptKey));
      }
      cfg={type:(t==='bar')?'bar':'line',data:{labels,datasets},options:baseOpts(true,combine==='堆疊')};
    }
    else if(t==='pie'){
      const xCol=gid('xSel',v).value,yCol=gid('ySel',v).value,method=gid('aggSel',v).value;
      const topN=Math.max(1,parseInt(gid('topN',v)&&gid('topN',v).value)||8);
      let labels=groupLabels(rows,xCol),vals=aggSeries(rows,xCol,yCol,method,labels);
      const sorted=labels.map((l,i)=>[l,vals[i]]).sort((a,b)=>b[1]-a[1]);
      let pairs=sorted.slice(0,topN);
      if(sorted.length>topN){const rest=sorted.slice(topN).reduce((s,p)=>s+p[1],0);pairs.push(['其他',rest])}
      seriesLabels=pairs.map(p=>p[0]);
      cfg={type:'pie',data:{labels:seriesLabels,datasets:[{data:pairs.map(p=>p[1]),backgroundColor:seriesLabels.map((l,i)=>colorFor(v,l,i)),borderColor:'#FCFDFA',borderWidth:2}]},options:baseOpts(true,false)};
    }
    else if(t==='scatter'){
      const xCol=gid('xSel',v).value,yCol=gid('ySel',v).value,label=`${yCol} vs ${xCol}`;
      let pts=rows.map(r=>({x:toNum(r[xCol]),y:toNum(r[yCol])})).filter(p=>!isNaN(p.x)&&!isNaN(p.y));
      const reg=linreg(pts);
      let plotPts=pts;
      if(pts.length>SCATTER_CAP){plotPts=pts.slice().sort((a,b)=>a.x-b.x);plotPts=lttb(plotPts,SCATTER_CAP);$(`msg_${v}`).innerHTML=`<p class="note">資料點較多,已用 LTTB 降採樣至 ${SCATTER_CAP.toLocaleString()} 點(保留趨勢)。</p>`}
      seriesLabels=[label];const col=colorFor(v,label,0);
      const dss=[{label,data:plotPts,backgroundColor:hexA(col,.5),borderColor:col,pointRadius:3}];
      const trend=gid('trend',v)?gid('trend',v).value:'隱藏';
      if(trend!=='隱藏'&&reg){
        dss.push({type:'line',label:`趨勢線 R²=${reg.r2.toFixed(3)}`,data:[{x:reg.minx,y:reg.slope*reg.minx+reg.intercept},{x:reg.maxx,y:reg.slope*reg.maxx+reg.intercept}],borderColor:'#185647',borderWidth:2,borderDash:[6,4],pointRadius:0,fill:false});
        const sign=reg.intercept>=0?'+':'−';
        $(`msg_${v}`).insertAdjacentHTML('beforeend',`<p class="note">線性回歸:y = ${reg.slope.toFixed(4)}·x ${sign} ${Math.abs(reg.intercept).toFixed(2)} ,R² = <b>${reg.r2.toFixed(3)}</b></p>`);
      }
      cfg={type:'scatter',data:{datasets:dss},options:Object.assign(baseOpts(true,false),{scales:{x:{title:{display:true,text:xCol},grid:{color:'#E5EADD'}},y:{title:{display:true,text:yCol},grid:{color:'#E5EADD'}}}})};
    }
    else if(t==='histogram'){
      const col=gid('xSel',v).value;let bins=parseInt(gid('bins',v).value)||10;bins=Math.max(2,Math.min(50,bins));
      const h=histogram(rows,col,bins),label=`${col} 次數分布`;seriesLabels=[label];const c=colorFor(v,label,0);
      cfg={type:'bar',data:{labels:h.labels,datasets:[{label,data:h.counts,backgroundColor:hexA(c,.8),borderColor:c,borderWidth:1,barPercentage:1,categoryPercentage:1}]},options:baseOpts(true,false)};
    }
    applyConditionMaybe(v,t,cfg);
    draw(v,cfg);
    renderColors(v,seriesLabels);
  }catch(err){showErr(`msg_${v}`,'繪製時發生問題,換個欄位組合試試。');console.error(err)}
}

function evalCond(spec,xVal,yVal){
  if(spec.fn){try{return !!spec.fn(xVal,toNum(yVal))}catch(e){return false}}
  const target=spec.on==='X'?xVal:yVal;
  if(spec.op==='between'){const n=toNum(target);return !isNaN(n)&&!isNaN(spec.val)&&!isNaN(spec.val2)&&n>=Math.min(spec.val,spec.val2)&&n<=Math.max(spec.val,spec.val2)}
  if(spec.op==='=='||spec.op==='!='){const n=toNum(target),m=Number(spec.rawVal);let eq;if(!isNaN(n)&&!isNaN(m)&&spec.rawVal!=='')eq=(n===m);else eq=(String(target)===spec.rawVal);return spec.op==='=='?eq:!eq}
  const n=toNum(target);if(isNaN(n)||isNaN(spec.val))return false;
  switch(spec.op){case'>':return n>spec.val;case'>=':return n>=spec.val;case'<':return n<spec.val;case'<=':return n<=spec.val}
  return false;
}
function applyConditionMaybe(v,t,cfg){
  const onEl=gid('condOn',v);if(!onEl||!['bar','line','points','scatter'].includes(t))return;
  const onSel=onEl.value,exprRaw=(gid('condExpr',v).value||'').trim();
  if(onSel==='off'&&!exprRaw)return;
  let fn=null;
  if(exprRaw){
    if(typeof math==='undefined'){$(`msg_${v}`).insertAdjacentHTML('beforeend',`<p class="note" style="color:var(--warn)">公式引擎未載入,略過進階公式。</p>`);return}
    try{const code=math.parse(exprRaw).compile();fn=(x,y)=>code.evaluate({x,y})}
    catch(e){$(`msg_${v}`).insertAdjacentHTML('beforeend',`<p class="note" style="color:var(--warn)">進階公式語法有誤,已略過標記。</p>`);return}
  }
  const spec={on:onSel==='X'?'X':'Y',op:gid('condOp',v).value,val:Number(gid('condVal',v).value),val2:Number(gid('condVal2',v).value),rawVal:(gid('condVal',v).value||'').trim(),fn};
  const hi=gid('condColor',v).value||'#D9533B';
  let total=0;
  cfg.data.datasets.forEach(ds=>{
    const base=ds.borderColor||hi;
    if(t==='scatter'){
      const mask=ds.data.map(p=>evalCond(spec,p.x,p.y));total+=mask.filter(Boolean).length;
      ds.pointBackgroundColor=mask.map(m=>m?hi:hexA(base,.22));
      ds.pointBorderColor=mask.map(m=>m?hi:hexA(base,.22));
      ds.pointRadius=mask.map(m=>m?5:3);
    }else{
      const labels=cfg.data.labels;
      const mask=ds.data.map((y,i)=>evalCond(spec,labels[i],y));total+=mask.filter(Boolean).length;
      if(t==='bar'){
        ds.backgroundColor=mask.map(m=>m?hexA(hi,.9):hexA(base,.2));
        ds.borderColor=mask.map(m=>m?hi:hexA(base,.4));
      }else{
        ds.pointBackgroundColor=mask.map(m=>m?hi:hexA(base,t==='line'?1:.22));
        ds.pointBorderColor=mask.map(m=>m?hi:hexA(base,.22));
        ds.pointBorderWidth=2;
        ds.pointRadius=mask.map(m=>t==='line'?(m?6:0):(m?6:3));
      }
    }
  });
  const onTxt=onSel==='off'?'公式':(onSel==='X'?'X 值':'Y 值');
  $(`msg_${v}`).insertAdjacentHTML('beforeend',`<p class="note">條件標記（依${onTxt}）:共 <b style="color:${hi}">${total}</b> 個資料點符合,以標記色顯示。</p>`);
}

function mkDS(type,label,data,color,lw,stacked,ptKey){
  if(type==='line'){
    return{label,data,borderColor:color,backgroundColor:hexA(color,.12),borderWidth:lw,tension:.25,fill:stacked,
      pointRadius:0,pointHoverRadius:4,pointHitRadius:8,pointBackgroundColor:color,pointBorderColor:color};
  }
  if(type==='points'){
    const pt=POINTS[ptKey]||POINTS['● 大圓點'];
    return{label,data,showLine:false,borderColor:color,backgroundColor:color,
      pointStyle:pt.s,pointRadius:pt.r,pointHoverRadius:pt.r+2,
      pointBackgroundColor:color,pointBorderColor:color,pointBorderWidth:2};
  }
  return{label,data,backgroundColor:hexA(color,.85),borderColor:color,borderWidth:1};
}
function baseOpts(legend,stacked){
  return{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},
    plugins:{legend:{display:legend,labels:{font:{family:"'JetBrains Mono',monospace",size:11},color:'#5C6670',boxWidth:12}}},
    scales:stacked?{x:{stacked:true,grid:{color:'#E5EADD'},ticks:{font:{size:10}}},y:{stacked:true,beginAtZero:true,grid:{color:'#E5EADD'}}}:undefined};
}
function draw(v,cfg){
  Chart.defaults.font.family="'Noto Sans TC',sans-serif";Chart.defaults.color='#5C6670';
  if(!cfg.options.scales&&cfg.type!=='pie')cfg.options.scales={x:{grid:{color:'#E5EADD'},ticks:{font:{size:10}}},y:{grid:{color:'#E5EADD'},beginAtZero:true}};
  if(state.views[v].chart)state.views[v].chart.destroy();
  state.views[v].chart=new Chart($(`canvas_${v}`).getContext('2d'),cfg);
}
function renderColors(v,labels){
  const box=gid('colors',v);if(!labels.length){box.innerHTML='';state.views[v]._csig='';return}
  const sig=labels.join('|');if(state.views[v]._csig===sig)return;state.views[v]._csig=sig;
  box.innerHTML='<span class="clbl">配色（點色塊調整）</span>'+labels.map((l,i)=>{
    const c=colorFor(v,l,i);
    return `<span class="color-item"><input type="color" value="${c}" data-label="${escapeHtml(l)}"><span>${escapeHtml(l)}</span></span>`;
  }).join('');
  box.querySelectorAll('input[type=color]').forEach(inp=>inp.addEventListener('input',e=>{state.views[v].colors[e.target.dataset.label]=e.target.value;recolorInPlace(v)}));
}
</script>
